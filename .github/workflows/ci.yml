name: CI

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: mlugg/setup-zig@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck:plugin
      - run: pnpm run build:plugin
      - run: pnpm run check:release
      - run: cargo test -p termux-bridge --test websocket_server -- --test-threads=1
      - run: cargo zigbuild -p termux-bridge --target aarch64-unknown-linux-musl --release
