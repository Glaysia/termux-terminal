name: CI

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install Android NDK
        run: |
          sdkmanager "ndk;30.0.16248370"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: sh -n scripts/install-termux-bridge.sh
      - run: pnpm run typecheck:plugin
      - run: pnpm run build:plugin
      - run: pnpm run check:release
      - run: cargo test -p termux-bridge --test websocket_server -- --test-threads=1
      - run: sh scripts/build-android-bridge.sh
