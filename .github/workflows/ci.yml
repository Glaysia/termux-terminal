name: CI

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install Android NDK
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 https://dl.google.com/android/repository/android-ndk-r30-linux.zip -o android-ndk-r30-linux.zip
          echo "5107f898313790e449e87eee2183d9a20602dee9  android-ndk-r30-linux.zip" | sha1sum -c -
          unzip -q android-ndk-r30-linux.zip
          echo "ANDROID_NDK_HOME=$RUNNER_TEMP/android-ndk-r30" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: sh -n scripts/install-termux-bridge.sh
      - run: pnpm run typecheck:plugin
      - run: pnpm run build:plugin
      - run: pnpm run check:release
      - run: cargo test -p termux-bridge --test websocket_server -- --test-threads=1
      - run: sh scripts/build-android-bridge.sh
